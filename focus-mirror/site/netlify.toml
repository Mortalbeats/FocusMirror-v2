# Netlify: static site, nothing to build.
[build]
  publish = "."
  command = ""

# Camera + microphone must be explicitly permitted for the tracking features.
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=()"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
